name: Funktionswunsch
description: Eine neue Funktion oder Verbesserung für Project NOMAD vorschlagen
title: "[Funktion]: "
labels: ["enhancement", "needs-discussion"]
body:
  - type: markdown
    attributes:
      value: |
        Vielen Dank für Ihr Interesse, Project NOMAD zu verbessern! Bevor Sie einen Funktionswunsch einreichen, prüfen Sie bitte unsere [Roadmap](https://roadmap.projectnomad.us) (englischsprachig, Original-Projekt), ob er bereits geplant ist oder umgesetzt wird. Neue Ideen können Sie dort ebenfalls vorschlagen, wenn Sie nicht selbst PRs eröffnen möchten.

        
        **Bitte beachten Sie:** Funktionswünsche werden nicht zwangsläufig umgesetzt. Alle Wünsche werden danach beurteilt, ob sie zu den Zielen des Projekts passen, wie machbar sie sind und wie groß der Bedarf in der Community ist.
        
        **Vor dem Absenden:**
        - Suchen Sie in vorhandenen Funktionswünschen und in unserer [Roadmap](https://roadmap.projectnomad.us), um Duplikate zu vermeiden
        - Überlegen Sie, ob der Wunsch zur Mission von NOMAD passt: Wissen und Bildung, zuerst offline
        - Bedenken Sie die technische Machbarkeit: NOMAD ist als Container-Anwendung für eine breite Palette an Hardware ausgelegt, daher werden Funktionen, die viele Ressourcen (abgesehen von GPU-intensiven Aufgaben) oder aufwendige Host-Konfigurationen erfordern, eher seltener umgesetzt
        - Bedenken Sie den Umfang: Kleine, gezielte Verbesserungen, die schrittweise umgesetzt werden können, werden eher realisiert als große, breit angelegte Funktionen, die erheblichen Entwicklungsaufwand erfordern oder deren Weg unklar ist
        - Wenn Sie Code, Tests oder Dokumentation beisteuern können, erhöht das die Chancen auf eine Umsetzung erheblich

  - type: dropdown
    id: feature-category
    attributes:
      label: Funktionskategorie
      description: Auf welchen Bereich bezieht sich die Funktion?
      options:
        - Neue Dienst-/Werkzeug-Integration
        - Verbesserung des KI-Assistenten
        - Verbesserung der Wissensdatenbank/RAG
        - Inhaltsverwaltung (ZIM, Karten, Sammlungen)
        - Verbesserung von UI/UX
        - Systemverwaltung
        - Leistungsoptimierung
        - Dokumentation
        - Sicherheit
        - Sonstiges
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problembeschreibung
      description: Welches Problem löst diese Funktion? Hängt Ihr Wunsch mit einem Ärgernis zusammen?
      placeholder: Es ärgert mich, wenn ... / Es wäre hilfreich, wenn ... / Nutzer haben Schwierigkeiten mit ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Lösungsvorschlag
      description: Beschreiben Sie die Funktion oder Verbesserung, die Sie sich wünschen
      placeholder: Eine Funktion hinzufügen, die ... / Das Verhalten ändern auf ... / Anbindung an ...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Lösungen
      description: Haben Sie alternative Lösungen oder Umgehungen in Betracht gezogen?
      placeholder: Ich habe ... versucht / Ein anderer Ansatz wäre ... / Eine Umgehung ist ...

  - type: textarea
    id: use-case
    attributes:
      label: Anwendungsfall
      description: Beschreiben Sie ein konkretes Szenario, in dem diese Funktion nützlich wäre
      placeholder: |
        Als [Art von Nutzer] möchte ich, wenn ich [etwas tue], [etwas erreichen], damit [Nutzen].
        
        Beispiel: Da ich eine dedizierte GPU habe, möchte ich in der Oberfläche sehen können, ob die GPU-Unterstützung aktiviert ist, damit ich die Leistung optimieren und Probleme leichter beheben kann.

  - type: dropdown
    id: user-type
    attributes:
      label: Wer würde von dieser Funktion profitieren?
      description: Welche Nutzergruppen hätten davon den größten Nutzen?
      multiple: true
      options:
        - Einzel-/Privatnutzer
        - Familien
        - Lehrkräfte/Pädagogen
        - Schüler/Studierende
        - Survivalisten/Prepper
        - Entwickler/Mitwirkende
        - Organisationen
        - Alle Nutzer
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Wie wichtig ist Ihnen diese Funktion?
      options:
        - Kritisch – hindert mich an der Nutzung von NOMAD
        - Hoch – würde meine Nutzung deutlich verbessern
        - Mittel – wäre schön zu haben
        - Niedrig – kleine Erleichterung
    validations:
      required: true

  - type: textarea
    id: implementation-ideas
    attributes:
      label: Ideen zur Umsetzung (optional)
      description: Falls Sie technische Vorschläge zur Umsetzung haben, teilen Sie sie hier mit
      placeholder: Dafür könnte man ... verwenden / Es könnte sich in ... einbinden lassen / Ein möglicher Ansatz ist ...

  - type: textarea
    id: examples
    attributes:
      label: Beispiele oder Referenzen
      description: Gibt es ähnliche Funktionen in anderen Anwendungen? Fügen Sie Links, Screenshots oder Beschreibungen bei
      placeholder: Ähnlich wie bei [App-Name] ... / Siehe dieses Beispiel unter [URL]

  - type: dropdown
    id: willing-to-contribute
    attributes:
      label: Würden Sie bei der Umsetzung helfen?
      description: Ihre Mithilfe erhöht die Wahrscheinlichkeit einer Umsetzung
      options:
        - "Ja – ich kann den Code schreiben"
        - "Ja – ich kann beim Testen helfen"
        - "Ja – ich kann bei der Dokumentation helfen"
        - "Vielleicht – mit Anleitung"
        - "Nein – mir fehlen die Kenntnisse/die Zeit"
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Zusätzlicher Kontext
      description: Weitere Angaben, Entwürfe, Diagramme oder Informationen zum Funktionswunsch

  - type: checkboxes
    id: checklist
    attributes:
      label: Checkliste vor dem Absenden
      description: Bitte bestätigen Sie vor dem Absenden Folgendes
      options:
        - label: Ich habe nach vorhandenen, ähnlichen Funktionswünschen gesucht
          required: true
        - label: Diese Funktion passt zur Mission von NOMAD (Wissen und Bildung, zuerst offline)
          required: true
        - label: Ich verstehe, dass Funktionswünsche nicht zwangsläufig umgesetzt werden
          required: true
