name: Fehlerbericht
description: Einen Fehler oder ein Problem mit Project NOMAD melden
title: "[Fehler]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Vielen Dank, dass Sie sich die Zeit nehmen, einen Fehler zu melden! Bitte füllen Sie die folgenden Angaben aus, damit wir das Problem eingrenzen und beheben können.
        
        **Vor dem Absenden:**
        - Suchen Sie in den vorhandenen Issues, um Duplikate zu vermeiden
        - Stellen Sie sicher, dass Sie die neueste Version von NOMAD verwenden
        - Entfernen Sie persönliche oder sensible Informationen aus Protokollen und Konfigurationen
        - Bitte melden Sie keine Probleme, die den Betrieb von NOMAD auf Unraid oder einem anderen NAS betreffen – wir planen derzeit nicht, solche Plattformen zu unterstützen

  - type: dropdown
    id: issue-category
    attributes:
      label: Problemkategorie
      description: Auf welchen Bereich bezieht sich dieses Problem?
      options:
        - Installation/Einrichtung
        - KI-Assistent (Ollama)
        - Wissensdatenbank/RAG (Dokument-Upload)
        - Docker-/Container-Probleme
        - GPU-Konfiguration
        - Inhalte herunterladen (ZIM, Karten, Sammlungen)
        - Dienstverwaltung (Starten/Stoppen/Aktualisieren)
        - Systemleistung/Ressourcen
        - Problem mit der Oberfläche (UI/Frontend)
        - Sonstiges
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Fehlerbeschreibung
      description: Beschreiben Sie den Fehler klar und knapp
      placeholder: Was ist passiert? Was hatten Sie erwartet?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Schritte zur Reproduktion
      description: Wie können wir dieses Problem nachvollziehen?
      placeholder: |
        1. Öffnen Sie '...'
        2. Klicken Sie auf '...'
        3. Der Fehler tritt auf
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Erwartetes Verhalten
      description: Was hatten Sie erwartet?
      placeholder: Beschreiben Sie das erwartete Ergebnis
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Tatsächliches Verhalten
      description: Was ist tatsächlich passiert?
      placeholder: Beschreiben Sie, was tatsächlich eingetreten ist, einschließlich aller Fehlermeldungen
    validations:
      required: true

  - type: input
    id: nomad-version
    attributes:
      label: NOMAD-Version
      description: Welche Version von NOMAD verwenden Sie? (Siehe Einstellungen > Update oder führen Sie `docker ps` aus und prüfen Sie das Image-Tag von nomad_admin)
      placeholder: "z. B. 1.29.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Betriebssystem
      description: Auf welchem Betriebssystem betreiben Sie NOMAD?
      options:
        - Ubuntu 26.04 (Resolute Raccoon)
        - Ubuntu 24.04
        - Ubuntu 22.04
        - Ubuntu 20.04
        - Debian 13 (Trixie)
        - Debian 12 (Bookworm)
        - Debian 11 (Bullseye)
        - Anderes Debian-basiertes System
        - Sonstiges (noch nicht offiziell unterstützt)
    validations:
      required: true

  - type: input
    id: docker-version
    attributes:
      label: Docker-Version
      description: Welche Version von Docker verwenden Sie? (`docker --version`)
      placeholder: "z. B. Docker version 24.0.7"

  - type: dropdown
    id: gpu-present
    attributes:
      label: Haben Sie eine dedizierte GPU?
      options:
        - "Ja"
        - "Nein"
        - "Weiß nicht"
    validations:
      required: true

  - type: input
    id: gpu-model
    attributes:
      label: GPU-Modell (falls zutreffend)
      description: Welches GPU-Modell haben Sie? (Siehe Einstellungen > System oder führen Sie bei einer NVIDIA-GPU `nvidia-smi` aus)
      placeholder: "z. B. NVIDIA GeForce RTX 3060"

  - type: textarea
    id: system-specs
    attributes:
      label: Systemdaten
      description: Geben Sie die relevanten Systemdaten an (CPU, RAM, freier Speicherplatz)
      placeholder: |
        CPU: 
        RAM: 
        Freier Speicherplatz: 
        GPU (falls vorhanden): 

  - type: textarea
    id: service-status
    attributes:
      label: Dienststatus (falls relevant)
      description: "Falls es um ein Dienstproblem geht: Wie ist der Status der betroffenen Dienste? (Siehe Einstellungen > Apps oder führen Sie `docker ps` aus)"
      placeholder: |
        Fügen Sie die Ausgabe von `docker ps` ein oder beschreiben Sie die Dienstzustände aus der Oberfläche

  - type: textarea
    id: logs
    attributes:
      label: Relevante Protokolle
      description: |
        Fügen Sie alle relevanten Protokolle oder Fehlermeldungen bei. **Bitte entfernen Sie persönliche/sensible Informationen.**
        
        Nützliche Befehle zum Sammeln von Protokollen:
        - NOMAD-Verwaltungsanwendung: `docker logs nomad_admin`
        - Ollama: `docker logs nomad_ollama`
        - Qdrant: `docker logs nomad_qdrant`
        - Bestimmter Dienst: `docker logs nomad_<service-name>`
      placeholder: Fügen Sie hier die relevante Protokollausgabe ein
      render: shell

  - type: textarea
    id: browser-console
    attributes:
      label: Fehler in der Browserkonsole (bei UI-Problemen)
      description: Falls es um ein UI-Problem geht, fügen Sie Fehler aus der Entwicklerkonsole Ihres Browsers bei (F12)
      placeholder: Fügen Sie hier die Fehler aus der Browserkonsole ein
      render: javascript

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Falls zutreffend, fügen Sie Screenshots bei, die Ihr Problem veranschaulichen (Bilder per Drag-and-drop hierher ziehen)

  - type: textarea
    id: additional-context
    attributes:
      label: Zusätzlicher Kontext
      description: Weitere Angaben zum Problem (Netzwerkaufbau, eigene Konfigurationen, kürzliche Änderungen usw.)

  - type: checkboxes
    id: terms
    attributes:
      label: Checkliste vor dem Absenden
      description: Bitte bestätigen Sie vor dem Absenden Folgendes
      options:
        - label: Ich habe nach vorhandenen Issues gesucht, die zu diesem Fehler passen könnten
          required: true
        - label: Ich verwende die neueste Version von Project NOMAD (oder habe meine Version oben angegeben)
          required: true
        - label: Ich habe persönliche und sensible Informationen aus Protokollen und Screenshots entfernt
          required: true
        - label: Dieses Problem hat NICHTS mit dem Betrieb von NOMAD auf einem nicht unterstützten bzw. nicht Debian-basierten Betriebssystem zu tun
          required: false
